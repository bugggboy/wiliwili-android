name: import-upstream
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取上游源码（不取子模块，保留 .gitmodules）
        uses: actions/checkout@v4
        with:
          repository: xfangfang/wiliwili
          ref: yoga
          path: src
          fetch-depth: 1
          submodules: false

      - name: 重建历史并推送到本仓库 yoga 分支
        run: |
          set -e
          cd src
          rm -rf .git
          git init -b yoga -q
          git config user.name "bugggboy"
          git config user.email "92500093+bugggboy@users.noreply.github.com"
          git add -A
          MSG='import: 从 xfangfang/wiliwili@yoga 导入源码（Android 移植起点）'
          git commit -q -m "$MSG"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin yoga
          echo "导入完成：$(git rev-parse --short HEAD)，文件数 $(git ls-files | wc -l)"
