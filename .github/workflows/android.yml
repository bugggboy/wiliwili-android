name: Android · 构建 APK

on:
  push:
    branches: [ yoga ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "CMakeLists.txt"
      - "wiliwili/**"
      - "resources/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

env:
  # NDK 与 minSdk 强绑定：r22 支持 api16+，r26+ 只支持 api21+ 且低版本会跑不起来
  NDK_VERSION: "22.1.7171670"
  CMAKE_VERSION: "3.22.1"
  MPV_ANDROID_TAG: "2026-09-17"
  MPV_HEADER_TAG: "v0.40.0"
  OPENSSL_VERSION: "1.1.1w"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它会尝试交互式接受 license，
      # 在非交互 runner 上直接失败。runner 已预装 SDK，这里手动接受 + 安装即可。
      - name: 准备 Android SDK / NDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SDKM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKM" ]; then
            echo "::error::找不到 sdkmanager"; ls "$SDK" || true; exit 1
          fi
          echo "sdkmanager=$SDKM"
          yes 2>/dev/null | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" 2>&1 | tail -5
          ls -d "$SDK/ndk/${NDK_VERSION}" "$SDK/cmake/${CMAKE_VERSION}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"     # AGP 7.4.2 支持 Gradle 7.5 ~ 8.0
          validate-wrappers: false    # 仓库里没有 wrapper；子模块里的 gradlew 会被误判

      # 不用 borealis 自带的 build_libromfs_generator.sh：
      # 它写的是 `cmake -B <build> <src>`，在当前 CMake 下会把 borealis 根目录
      # 当成源目录（进而 include toolchain.cmake 报 "Please set build target"）。
      # 这里直接给出等价的、带 -S 的写法。
      - name: 构建 host 版 libromfs-generator
        run: |
          set -e
          cd library/borealis
          SRC=library/lib/extern/libromfs/generator
          test -f "$SRC/CMakeLists.txt"
          cmake -S "$SRC" -B build_libromfs_generator
          cmake --build build_libromfs_generator -j"$(nproc)"
          cp build_libromfs_generator/libromfs-generator .
          rm -rf build_libromfs_generator
          ls -la libromfs-generator
          file libromfs-generator | head -1

      # ---------------------------------------------------------------
      # mpv：Android 上没有现成的 CMake 包，从 mpv-android 的 release APK
      # 里取出已编译好的 libmpv.so，头文件单独从 mpv 源码取。
      # 好处：不用在 CI 里花 40 分钟交叉编译 FFmpeg + mpv。
      # ---------------------------------------------------------------
      - name: 缓存依赖（OpenSSL / libmpv）
        uses: actions/cache@v4
        with:
          path: |
            .deps/openssl
            .deps/mpv
          key: android-deps-${{ env.NDK_VERSION }}-${{ env.MPV_ANDROID_TAG }}-${{ env.OPENSSL_VERSION }}

      # cpr 需要 SSL 后端，Android NDK 不提供 OpenSSL，这里用 NDK 自己编两份静态库
      - name: 编译 OpenSSL（arm64-v8a / armeabi-v7a）
        run: |
          set -e
          export WILI_DEPS="$PWD/.deps"
          mkdir -p "$WILI_DEPS"
          # OpenSSL 1.1.1 的 15-android.conf 认 ANDROID_NDK_ROOT（不是 ANDROID_NDK_HOME），
          # 并且要在 PATH 里找到 <triple><api>-clang，否则会退回找 gcc 然后报
          # "no NDK aarch64-linux-android-gcc on $PATH"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME:-$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}}"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          ls "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -m3 "android23-clang" || true
          if [ -f "$WILI_DEPS/openssl/arm64-v8a/lib/libssl.a" ] && \
             [ -f "$WILI_DEPS/openssl/armeabi-v7a/lib/libssl.a" ]; then
            echo "OpenSSL 已缓存，跳过"
          else
            curl -sSL --retry 3 -o /tmp/openssl.tar.gz \
              "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
            for pair in "arm64-v8a:android-arm64" "armeabi-v7a:android-arm"; do
              abi="${pair%%:*}"; tgt="${pair##*:}"
              dir="/tmp/ossl-$abi"
              rm -rf "$dir"; mkdir -p "$dir"
              tar xzf /tmp/openssl.tar.gz -C "$dir" --strip-components=1
              echo "==> OpenSSL $abi ($tgt)"
              ( cd "$dir"
                ./Configure "$tgt" -D__ANDROID_API__=23 \
                  --prefix="$WILI_DEPS/openssl/$abi" \
                  no-shared no-tests no-asm >/dev/null
                make -j"$(nproc)" >/dev/null
                make install_sw >/dev/null )
            done
          fi
          ls -la "$WILI_DEPS/openssl"/*/lib/libssl.a
          echo "WILI_DEPS=$WILI_DEPS" >> "$GITHUB_ENV"

      - name: 准备 libmpv（arm64-v8a / armeabi-v7a）
        run: |
          set -e
          PREFIX="${WILI_DEPS:-$PWD/.deps}/mpv"
          mkdir -p "$PREFIX/include/mpv" "$PREFIX/lib" android/app/libs dl

          for pair in "arm64-v8a:app-default-arm64-v8a-release.apk" "armeabi-v7a:app-default-armeabi-v7a-release.apk"; do
            abi="${pair%%:*}"
            apk="${pair##*:}"
            mkdir -p "$PREFIX/lib/$abi" "android/app/libs/$abi"
            if [ ! -f "dl/$apk" ]; then
              curl -sSL --retry 3 -o "dl/$apk" \
                "https://github.com/mpv-android/mpv-android/releases/download/${MPV_ANDROID_TAG}/${apk}"
            fi
            # libmpv.so 是动态链接的，运行时还要 libavcodec / libavformat / libavutil /
            # libswresample / libswscale / libavfilter / libplacebo 等同目录的 .so，
            # 所以整个 lib/<abi>/ 都要取出来，只把 libmpv.so 拿去链接。
            rm -rf "dl/x-$abi"; mkdir -p "dl/x-$abi"
            unzip -o "dl/$apk" "lib/$abi/*.so" -d "dl/x-$abi" >/dev/null
            echo "---- $abi 依赖库 ----"
            ls -la "dl/x-$abi/lib/$abi" | awk '{print "  ", $5, $9}'
            copytolibs() {
              for so in "dl/x-$abi/lib/$abi"/*.so; do
                n=$(basename "$so")
                # libc++_shared.so 不能直接进 jniLibs（会和 CMake 从 NDK 拷出来的那份撞路径），
                # 先单独收起来，交给后面「统一 libc++ 运行时」那步换进 NDK。
                if [ "$n" = "libc++_shared.so" ]; then
                  mkdir -p "dl/cxx/$abi"
                  cp "$so" "dl/cxx/$abi/libc++_shared.so"
                  echo "   libc++_shared.so 已暂存 ($(stat -c%s "$so") 字节)"
                  continue
                fi
                cp "$so" "android/app/libs/$abi/$n"
              done
            }
            mkdir -p "android/app/libs/$abi"
            copytolibs
            cp "dl/x-$abi/lib/$abi/libmpv.so" "$PREFIX/lib/$abi/libmpv.so"
            echo "$abi libmpv: $(du -h "$PREFIX/lib/$abi/libmpv.so" | cut -f1)"
            echo "---- $abi libmpv 的 NEEDED ----"
            readelf -d "$PREFIX/lib/$abi/libmpv.so" 2>/dev/null | grep NEEDED | head -20 || true
            if ! strings "$PREFIX/lib/$abi/libmpv.so" | grep -q "mpv_render_context_create"; then
              echo "::warning::$abi 的 libmpv.so 可能不含 render API"
            fi
          done

          for h in client.h render.h render_gl.h stream_cb.h; do
            curl -sSL --retry 3 -o "$PREFIX/include/mpv/$h" \
              "https://raw.githubusercontent.com/mpv-player/mpv/${MPV_HEADER_TAG}/include/mpv/$h"
          done
          ls -la "$PREFIX/include/mpv"

          cat > "$PREFIX/mpv.pc" <<PC
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: mpv
          Description: mpv media player client library (Android prebuilt)
          Version: ${MPV_HEADER_TAG#v}
          Libs: -lmpv
          Cflags: -I\${includedir}
          PC
          echo "PKG_CONFIG_PATH=$PREFIX" >> "$GITHUB_ENV"
          echo "MPV_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 【关键】libc++ 运行时必须是全包唯一且最新的那一份。
      #
      # libmpv.so 是 mpv-android 用 NDK r28 编的，内部用了 libc++ 14+ 才有的
      # std::to_chars(char*, char*, float)。我们自己的 NDK 22 的 libc++_shared.so
      # 里没有这个符号，混着用真机直接：
      #   dlopen failed: cannot locate symbol "_ZNSt6__ndk18to_charsEPcS0_f"
      #   referenced by .../lib/arm64-v8a/libmpv.so
      #
      # 解法：整包只用 mpv-android 自带的 r28 版 libc++_shared.so（min api 21，
      # 对旧版是超集，向后兼容），把 NDK 里的同名文件覆盖掉 —— 这样「链接用的」
      # 和「打进 APK 的」是同一个文件，只有一份来源，不会再来一次版本错配。
      # ---------------------------------------------------------------
      - name: 统一 libc++ 运行时（mpv-android 的 r28 版覆盖 NDK 22 的）
        run: |
          set -e
          NDK="${ANDROID_NDK_HOME:?}"
          echo "NDK=$NDK"
          for abi in arm64-v8a armeabi-v7a; do
            src="dl/cxx/$abi/libc++_shared.so"
            if [ ! -f "$src" ]; then echo "::error::缺少 $src"; exit 1; fi
            echo "==> $abi 源文件 $(stat -c%s "$src") 字节"
            n=0
            # NDK 里可能同时存在 sources/cxx-stl/.../libs/<abi>/ 和 sysroot/usr/lib/<triple>/
            # 两处 libc++_shared.so，链接和打包各取一处，必须都覆盖。
            while IFS= read -r dst; do
              sudo cp "$src" "$dst"
              n=$((n + 1))
              echo "   → ${dst#"$NDK"/}  $(stat -c%s "$dst") 字节"
            done < <(find "$NDK" -name libc++_shared.so -path "*$abi*" 2>/dev/null)
            if [ "$n" -eq 0 ]; then echo "::error::NDK 里没找到 $abi 的 libc++_shared.so"; exit 1; fi
          done
          f="$NDK/sources/cxx-stl/llvm-libc++/libs/arm64-v8a/libc++_shared.so"
          if strings "$f" | grep -q '_ZNSt6__ndk18to_charsEPcS0_f'; then
            echo "✅ to_chars(char*,char*,float) 已就位"
          else
            echo "::error::覆盖后仍缺 to_chars，别往下走了"; exit 1
          fi

      - name: 复制 SDL 的 Java 层
        run: |
          mkdir -p android/app/src/main/java
          cp -r library/borealis/android-project/app/src/main/java/org android/app/src/main/java/
          find android/app/src/main/java/org -name "*.java" | wc -l

      - name: 配置 + 编译（arm64-v8a / armeabi-v7a）
        run: |
          set -o pipefail          # 否则 tee 会吞掉 gradle 的失败退出码
          cd android
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: 校验产物
        if: always()
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK=$APK"
          if [ -z "$APK" ]; then
            echo "::error::没有产出 APK"
            grep -nE "error:|FAILED|CMake Error|undefined reference|not found" /tmp/gradle.log | head -25 || true
            exit 1
          fi
          ls -lh "$APK"
          echo "===== APK 内所有 .so ====="
          unzip -l "$APK" | grep -E "lib/.*\.so$" || echo "!! APK 里没有任何 .so"
          echo "===== .so 统计 ====="
          unzip -l "$APK" | awk '/lib\/.*\.so$/{n++; s+=$1; printf "  %-46s %7.1f MB\n", $4, $1/1048576} END{printf "  合计 %d 个 / %.1f MB\n", n, s/1048576}'
          echo "===== 运行时依赖完整性 ====="
          for so in "android/app/libs"/*/*.so; do
            [ -f "$so" ] || continue
            miss=$(readelf -d "$so" 2>/dev/null | awk '/NEEDED/{gsub(/\[|\]/,"",$5); print $5}' \
                   | grep -vE "^(libc\.so|libm\.so|libdl\.so|liblog\.so|libz\.so|libstdc\+\+\.so|libc\+\+_shared\.so|libandroid\.so|libGLESv[0-9]\.so|libEGL\.so|libOpenSLES\.so|libjnigraphics\.so|libmediandk\.so)$" \
                   | while read -r need; do [ -f "android/app/libs/$(basename $(dirname "$so"))/$need" ] || echo "$need"; done)
            [ -n "$miss" ] && echo "!! $(basename "$so") 缺: $miss"
          done
          echo "===== dex / 资源 ====="
          unzip -l "$APK" | awk '/classes.*\.dex$|resources\.arsc$/{printf "  %-46s %7.1f MB\n", $4, $1/1048576}'

          # ---------------------------------------------------------------
          # 真机 dlopen 守门员：APK 里每个 .so 的 C++ 未定义符号，必须能在
          # 同 ABI 的其它 .so 里找到定义。漏一个，安装后就是闪退。
          # 只查 _Z*（C++ mangled），系统 libc/libm 的符号不参与，避免误报。
          # ---------------------------------------------------------------
          echo "===== C++ 符号完整性（真机 dlopen 守门员）====="
          rm -rf /tmp/apkx && mkdir -p /tmp/apkx
          unzip -o -q "$APK" 'lib/*' -d /tmp/apkx
          bad=0
          for abi in arm64-v8a armeabi-v7a; do
            abibad=0
            cxx="/tmp/apkx/lib/$abi/libc++_shared.so"
            if [ ! -f "$cxx" ]; then echo "::error::$abi 缺 libc++_shared.so"; exit 1; fi
            echo "  $abi libc++_shared.so = $(stat -c%s "$cxx") 字节"
            if strings "$cxx" | grep -q '_ZNSt6__ndk18to_charsEPcS0_f'; then
              echo "  ✅ to_chars(float) 存在"
            else
              echo "::error::$abi 的 libc++_shared.so 没有 to_chars(float)，装上必然 dlopen 失败"; abibad=1
            fi
            # 汇总同 ABI 下所有 .so 的已定义符号
            : > /tmp/def.txt
            for d in /tmp/apkx/lib/"$abi"/*.so; do
              readelf -sW --dyn-syms "$d" 2>/dev/null | awk '$7 != "UND" && $4 ~ /FUNC|OBJECT|IFUNC/ {print $8}' >> /tmp/def.txt
            done
            sort -u -o /tmp/def.txt /tmp/def.txt
            for so in /tmp/apkx/lib/"$abi"/*.so; do
              miss=$(readelf -sW --dyn-syms "$so" 2>/dev/null \
                     | awk '$7 == "UND" {print $8}' | grep -E '^_Z' | sort -u \
                     | while read -r s; do grep -qxF "$s" /tmp/def.txt || echo "$s"; done)
              if [ -n "$miss" ]; then
                echo "::error::$(basename "$so") 有 $(echo "$miss" | wc -l) 个 C++ 符号在包内无定义："
                echo "$miss" | head -5 | sed 's/^/     /'
                abibad=1
              fi
            done
            if [ "$abibad" -eq 0 ]; then echo "  ✅ $abi 全部 .so 的 C++ 符号都能在包内解析"; else bad=1; fi
          done
          if [ "$bad" -ne 0 ]; then echo "::error::符号不完整，这个 APK 装上去会闪退"; exit 1; fi

          mkdir -p out
          cp "$APK" out/wiliwili-android-debug.apk
          echo "APK_SIZE=$(du -h out/wiliwili-android-debug.apk | cut -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiliwili-android-debug
          path: out/wiliwili-android-debug.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: 挂到 Release（手机浏览器直链下载）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f out/wiliwili-android-debug.apk ] || exit 0
          TAG=android-preview
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "wiliwili for Android (debug build)" \
                 --notes "wiliwili 的 Android 移植预览版。debug 签名，可直接安装。最低 Android 6.0（API 23）。" \
                 --latest
          gh release upload "$TAG" out/wiliwili-android-debug.apk --clobber
