plugins {
    id 'com.android.application'
}

// 关键约束（NDK 版本与 minSdk 强相关，改之前先读注释）：
//   r22/r23  → 支持 api16+
//   r24/r25  → 支持 api19+
//   r26+     → 只支持 api21+，且会让低版本 Android 无法运行
// 本项目要求 Android 6.0（api23），用 r22 最稳。
android {
    namespace "com.bugggboy.wiliwili"
    compileSdkVersion 31

    defaultConfig {
        applicationId "com.bugggboy.wiliwili"
        minSdkVersion 23          // Android 6.0
        targetSdkVersion 31
        versionCode 1
        versionName "1.6.0"

        ndkVersion "22.1.7171670"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-23",
                          "-DANDROID_STL=c++_shared",
                          "-DCMAKE_WARN_DEPRECATED=FALSE"
                // Windows 上没有 pkg-config，wiliwili 根 CMakeLists 又要用它找 mpv。
                // 由本地构建脚本用 -PpkgConfigExe=... 传进来；CI（Linux）不传，行为不变。
                if (project.hasProperty("pkgConfigExe")) {
                    arguments += "-DPKG_CONFIG_EXECUTABLE=${project.pkgConfigExe}"
                }
                // cpr 用 FetchContent 拉 zlib-ng（git clone）和 curl（github releases），
                // 本机 git/直连都不通，指向本地已解压的源码；CI 不传，行为不变。
                if (project.hasProperty("fetchContentDirs")) {
                    project.property("fetchContentDirs").split(";").each { kv ->
                        def (k, v) = kv.split("=", 2)
                        arguments += "-DFETCHCONTENT_SOURCE_DIR_${k.toUpperCase()}=${v}"
                    }
                }
                abiFilters 'armeabi-v7a', 'arm64-v8a'
                version = '3.22.1'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 预览包统一用 debug 签名，保证下载下来就能装（和 debug 包同一个 key，
            // 因此两个版本可以互相覆盖安装）
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // Android 6.0 专用包用「解压安装」：6.0 的加载器对 APK 内未压缩 .so 的
            // 支持在部分 ROM 上有差异，解压到 /data/app 后再加载最稳，也方便排查。
            // 默认（false）保持原来的 in-APK 加载行为，不影响已有版本。
            useLegacyPackaging = project.hasProperty('legacyPackaging') &&
                    project.property('legacyPackaging').toBoolean()
        }
    }

    // mpv 的 libmpv.so 由 CI 下载 mpv-android 的 APK 后解出来放到 libs/<abi>/
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version = '3.22.1'
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
