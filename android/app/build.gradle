plugins {
    id 'com.android.application'
}

// 关键约束（NDK 版本与 minSdk 强相关，改之前先读注释）：
//   r22/r23  → 支持 api16+
//   r24/r25  → 支持 api19+
//   r26+     → 只支持 api21+，且会让低版本 Android 无法运行
// 本项目要求 Android 6.0（api23），用 r22 最稳。
android {
    namespace "com.bugggboy.wiliwili"
    compileSdkVersion 31

    defaultConfig {
        applicationId "com.bugggboy.wiliwili"
        minSdkVersion 23          // Android 6.0
        targetSdkVersion 31
        versionCode 1
        versionName "1.6.0"

        ndkVersion "22.1.7171670"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-23",
                          "-DANDROID_STL=c++_shared",
                          "-DCMAKE_WARN_DEPRECATED=FALSE"
                abiFilters 'armeabi-v7a', 'arm64-v8a'
                version = '3.22.1'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // mpv 的 libmpv.so 由 CI 下载 mpv-android 的 APK 后解出来放到 libs/<abi>/
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version = '3.22.1'
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
